<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer id="footer" contentEditable="{{ isAdmin }}" style="background:#0F172A;border-top:1px solid rgba(148,163,184,0.12);padding:48px 48px 40px">
  <div style="max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:32px">
    <div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:600;color:#06B6D4;margin-bottom:8px">AuroraFS</div>
      <p style="font-size:13px;color:#64748B;white-space:nowrap;line-height:1.6;margin:0">AI 반도체 클라우드를 위한 고속 병렬 파일시스템 기술개발 · Adv-FileSystem</p>
    </div>
    <div style="display:flex;gap:16px;flex-wrap:wrap">
      <a href="https://github.com/Adv-FileSystem" target="_blank" rel="noopener" style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:#94A3B8;letter-spacing:0.05em;padding:8px 16px;border:1px solid rgba(148,163,184,0.12);border-radius:3px;white-space:nowrap;text-decoration:none" style-hover="border-color:#2563EB;color:#2563EB">GitHub</a>
    </div>
  </div>
  <div style="max-width:1100px;margin:32px auto 0;padding-top:24px;border-top:1px solid rgba(148,163,184,0.12);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
    <span style="font-size:12px;color:#64748B">AuroraFS Consortium</span>
    <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#64748B;letter-spacing:0.08em">Apache 2.0</span>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:220},&quot;isAdmin&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;}}"></script>
</body>
</html>
