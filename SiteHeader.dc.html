<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav style="position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:64px;background:rgba(10,15,30,0.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(148,163,184,0.12)">
  <a href="index.html" style="font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;color:#06B6D4;letter-spacing:0.05em;text-decoration:none">AuroraFS</a>
  <ul style="display:flex;gap:32px;list-style:none;margin:0;padding:0">
    <li><a href="index.html" style="font-size:13px;font-weight:600;color:{{ colorOverview }};letter-spacing:0.03em;text-decoration:none" style-hover="color:#F1F5F9">개요</a></li>
    <li><a href="goals.dc.html" style="font-size:13px;font-weight:600;color:{{ colorGoals }};letter-spacing:0.03em;text-decoration:none" style-hover="color:#F1F5F9">목표</a></li>
    <li><a href="tech.dc.html" style="font-size:13px;font-weight:600;color:{{ colorTech }};letter-spacing:0.03em;text-decoration:none" style-hover="color:#F1F5F9">원천기술</a></li>
    <li><a href="devcontent.dc.html" style="font-size:13px;font-weight:600;color:{{ colorDevcontent }};letter-spacing:0.03em;text-decoration:none" style-hover="color:#F1F5F9">개발내용</a></li>
    <li><a href="github.dc.html" style="font-size:13px;font-weight:600;color:{{ colorGithub }};letter-spacing:0.03em;text-decoration:none" style-hover="color:#F1F5F9">GitHub</a></li>
    <li><a href="members.dc.html" style="font-size:13px;font-weight:600;color:{{ colorMembers }};letter-spacing:0.03em;text-decoration:none" style-hover="color:#F1F5F9">커뮤니티</a></li>
  </ul>
  <div style="display:flex;align-items:center;gap:12px">
    <div style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#2563EB;border:1px solid #2563EB;padding:4px 12px;border-radius:2px;white-space:nowrap">GOVT R&amp;D</div>
    <sc-if value="{{ isAdmin }}" hint-placeholder-val="{{ false }}">
      <span style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.05em;color:#06B6D4;white-space:nowrap">관리자 모드</span>
      <sc-if value="{{ savedMsg }}" hint-placeholder-val="{{ false }}">
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#34D399;white-space:nowrap">저장됨 ✓</span>
      </sc-if>
      <button onClick="{{ saveAll }}" style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.05em;color:#fff;background:#2563EB;border:none;padding:6px 14px;border-radius:2px;cursor:pointer;white-space:nowrap">저장하기</button>
      <button onClick="{{ logout }}" style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.05em;color:#94A3B8;background:transparent;border:1px solid rgba(148,163,184,0.3);padding:6px 14px;border-radius:2px;cursor:pointer;white-space:nowrap">닫기</button>
    </sc-if>
    <sc-if value="{{ notAdmin }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ openLogin }}" style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.05em;color:#94A3B8;background:transparent;border:1px solid rgba(148,163,184,0.3);padding:6px 14px;border-radius:2px;cursor:pointer;white-space:nowrap" style-hover="border-color:#06B6D4;color:#06B6D4">관리자 로그인</button>
    </sc-if>
  </div>
</nav>

<sc-if value="{{ showLogin }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;z-index:200;background:rgba(10,15,30,0.75);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center" onClick="{{ closeLogin }}">
    <div style="width:340px;background:#0F172A;border:1px solid rgba(148,163,184,0.15);border-radius:8px;padding:32px" onClick="{{ stopClick }}">
      <div style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;color:#06B6D4;margin-bottom:14px">Admin Login</div>
      <h3 style="font-size:18px;font-weight:700;margin:0 0 20px;color:#F1F5F9">관리자 로그인</h3>
      <input ref="{{ idRef }}" type="text" placeholder="아이디" style="width:100%;box-sizing:border-box;padding:10px 12px;margin-bottom:12px;background:#0A0F1E;border:1px solid rgba(148,163,184,0.2);border-radius:4px;color:#F1F5F9;font-size:14px" />
      <input ref="{{ pwRef }}" type="password" placeholder="비밀번호" onKeyDown="{{ onPwKeyDown }}" style="width:100%;box-sizing:border-box;padding:10px 12px;margin-bottom:8px;background:#0A0F1E;border:1px solid rgba(148,163,184,0.2);border-radius:4px;color:#F1F5F9;font-size:14px" />
      <sc-if value="{{ err }}" hint-placeholder-val="{{ false }}">
        <div style="font-size:12px;color:#F87171;margin-bottom:12px">{{ err }}</div>
      </sc-if>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button onClick="{{ closeLogin }}" style="flex:1;padding:10px;background:transparent;border:1px solid rgba(148,163,184,0.2);border-radius:4px;color:#94A3B8;font-size:14px;cursor:pointer">취소</button>
        <button onClick="{{ doLogin }}" style="flex:1;padding:10px;background:#2563EB;border:none;border-radius:4px;color:#fff;font-size:14px;font-weight:700;cursor:pointer">로그인</button>
      </div>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:64},&quot;active&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;isAdmin&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;notAdmin&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showLogin&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;err&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;savedMsg&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;idRef&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;pwRef&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;doLogin&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;},&quot;logout&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;},&quot;openLogin&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;},&quot;closeLogin&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;},&quot;stopClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;},&quot;onPwKeyDown&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;},&quot;saveAll&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;}}">class Component extends DCLogic {
  renderVals() {
    const active = this.props.active;
    const color = (id) => active === id ? '#2563EB' : '#94A3B8';
    return {
      colorOverview: color('overview'),
      colorGoals: color('goals'),
      colorTech: color('tech'),
      colorDevcontent: color('devcontent'),
      colorGithub: color('github'),
      colorMembers: color('members')
    };
  }
}</script>
</body>
</html>
