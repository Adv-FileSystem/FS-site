<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<template id="__bundler_thumbnail" data-bg-color="#0A0F1E">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0A0F1E"/>
    <text x="600" y="420" text-anchor="middle" font-family="monospace" font-size="120" font-weight="700" fill="#06B6D4">FS</text>
  </svg>
</template>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { margin:0; background:#0A0F1E; color:#F1F5F9; font-family:'Noto Sans KR', sans-serif; overflow-x:hidden; }
[contenteditable="true"] a { -webkit-user-modify: read-only; user-modify: read-only; cursor: pointer; }
[contenteditable="true"] *:not(:has(*)):not(a):not([style*="JetBrains"]) { outline: 1px dashed #06B6D4; outline-offset: 2px; }
[contenteditable="true"] *:not(:has(*)):not(a):not([style*="JetBrains"]):focus { outline: 2px dashed #06B6D4; }
</style>
</helmet>

<div style="min-height:100vh">

<dc-import name="SiteHeader" active="devcontent" is-admin="{{ isAdmin }}" not-admin="{{ notAdmin }}" show-login="{{ showLogin }}" err="{{ err }}" saved-msg="{{ savedMsg }}" id-ref="{{ idRef }}" pw-ref="{{ pwRef }}" do-login="{{ doLogin }}" logout="{{ logout }}" open-login="{{ openLogin }}" close-login="{{ closeLogin }}" stop-click="{{ stopClick }}" on-pw-key-down="{{ onPwKeyDown }}" save-all="{{ saveAll }}" hint-size="100%,64px"></dc-import>

<section id="devcontent" style="display:flex;background:#0A0F1E;padding-top:64px;min-height:100vh">
  <aside style="width:272px;flex-shrink:0;background:#0B1220;border-right:1px solid rgba(148,163,184,0.12);padding:28px 0 40px;position:sticky;top:64px;align-self:flex-start;height:calc(100vh - 64px);overflow-y:auto">
    <div style="padding:0 24px;margin-bottom:14px">
      <div style="font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;letter-spacing:0.15em;color:#64748B;text-transform:uppercase;white-space:nowrap">Dev Docs</div>
    </div>
    <div style="padding:0 24px;margin-bottom:24px">
      <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#06B6D4;background:rgba(6,182,212,0.1);border:1px solid rgba(6,182,212,0.25);padding:3px 10px;border-radius:10px;white-space:nowrap;display:inline-block">한국전자기술연구원</div>
    </div>
    <nav style="display:flex;flex-direction:column;padding:0 12px">
      <sc-for list="{{ categories }}" as="cat" hint-placeholder-count="3">
        <div style="margin-bottom:6px">
          <div onClick="{{ cat.toggle }}" style="cursor:pointer;padding:9px 12px 9px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:6px" style-hover="background:rgba(148,163,184,0.06)">
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:14px">{{ cat.icon }}</span>
              <span style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:0.05em;color:#CBD5E1;text-transform:uppercase;white-space:nowrap">{{ cat.name }}</span>
            </div>
            <span style="font-size:14px;color:#64748B;display:inline-block;transform:{{ cat.arrowTransform }};transition:transform 0.15s;flex-shrink:0">▸</span>
          </div>
          <sc-if value="{{ cat.expanded }}" hint-placeholder-val="{{ true }}">
            <div style="display:flex;flex-direction:column;gap:2px;padding-top:2px">
              <sc-for list="{{ cat.items }}" as="it" hint-placeholder-count="2">
                <div onClick="{{ it.select }}" style="cursor:pointer;padding:8px 12px 8px 34px;border-radius:6px;border-left:2px solid {{ it.borderColor }};background:{{ it.bg }};transition:background 0.15s" style-hover="background:rgba(148,163,184,0.07)">
                  <span style="font-size:13px;color:{{ it.titleColor }};font-weight:{{ it.titleWeight }};line-height:1.4">{{ it.nav }}</span>
                </div>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </nav>
  </aside>

  <div contentEditable="{{ isAdmin }}" style="flex:1;padding:64px 56px;max-width:820px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
      <span style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:#06B6D4;letter-spacing:0.1em">PART {{ selected.partNum }}</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#64748B;white-space:nowrap">· 한국전자기술연구원</span>
    </div>
    <h2 style="font-size:clamp(22px,2.6vw,32px);font-weight:800;line-height:1.3;letter-spacing:-0.01em;margin:0 0 20px;color:#F1F5F9">{{ selected.title }}</h2>
    <p style="font-size:15px;color:#94A3B8;line-height:1.9;margin:0 0 32px">{{ selected.desc }}</p>

    <div style="font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#06B6D4;margin-bottom:14px">핵심 내용</div>
    <ul style="margin:0 0 32px;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px">
      <sc-for list="{{ selected.features }}" as="f" hint-placeholder-count="3">
        <li style="display:flex;gap:10px;font-size:14px;color:#CBD5E1;line-height:1.8">
          <span style="color:#06B6D4;flex-shrink:0">›</span>
          <span>
            <sc-for list="{{ f.segs }}" as="seg" hint-placeholder-count="1">
              <sc-if value="{{ seg.isCode }}" hint-placeholder-val="{{ false }}">
                <code style="font-family:'JetBrains Mono',monospace;font-size:0.88em;color:#67E8F9;background:rgba(6,182,212,0.1);padding:1px 5px;border-radius:3px">{{ seg.text }}</code>
              </sc-if>
              <sc-if value="{{ seg.isCodeFalse }}" hint-placeholder-val="{{ true }}">
                <span>{{ seg.text }}</span>
              </sc-if>
            </sc-for>
          </span>
        </li>
      </sc-for>
    </ul>

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px">
      <sc-for list="{{ selected.stack }}" as="s" hint-placeholder-count="3">
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#94A3B8;background:rgba(148,163,184,0.08);border:1px solid rgba(148,163,184,0.18);padding:4px 10px;border-radius:2px">{{ s }}</span>
      </sc-for>
    </div>

    <sc-if value="{{ selected.hasCode }}" hint-placeholder-val="{{ false }}">
      <div style="margin-bottom:28px">
        <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#64748B;margin-bottom:8px">{{ selected.codeLabel }}</div>
        <pre style="background:#0B1220;border:1px solid rgba(148,163,184,0.15);border-radius:6px;padding:16px;overflow-x:auto;margin:0 0 10px"><code style="font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.7;color:#CBD5E1;white-space:pre">{{ selected.code }}</code></pre>
        <p style="font-size:13px;color:#94A3B8;line-height:1.8;margin:0">
          <sc-for list="{{ selected.codeDescSegs }}" as="seg" hint-placeholder-count="1">
            <sc-if value="{{ seg.isCode }}" hint-placeholder-val="{{ false }}">
              <code style="font-family:'JetBrains Mono',monospace;font-size:0.9em;color:#67E8F9;background:rgba(6,182,212,0.1);padding:1px 5px;border-radius:3px">{{ seg.text }}</code>
            </sc-if>
            <sc-if value="{{ seg.isCodeFalse }}" hint-placeholder-val="{{ true }}">
              <span>{{ seg.text }}</span>
            </sc-if>
          </sc-for>
        </p>
      </div>
    </sc-if>


    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <sc-for list="{{ selected.links }}" as="lk" hint-placeholder-count="1">
        <a href="{{ lk.url }}" target="_blank" rel="noopener" style="display:inline-block;font-family:'JetBrains Mono',monospace;font-size:12px;color:#2563EB;background:rgba(37,99,235,0.1);border:1px solid rgba(37,99,235,0.25);padding:5px 12px;border-radius:2px;text-decoration:none" style-hover="text-decoration:underline">{{ lk.name }}</a>
      </sc-for>
    </div>
  </div>
</section>

<dc-import name="SiteFooter" is-admin="{{ isAdmin }}" hint-size="100%,220px"></dc-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { isAdmin: false, showLogin: false, err: '', selectedIndex: 0, expandedCats: { 0: true, 1: true, 2: true } };

  categoryDefs = [
    { name: '인프라 코어', icon: '⚙️', indexes: [0, 1] },
    { name: 'AI 데이터 파이프라인', icon: '🔁', indexes: [2, 3, 4] },
    { name: '성능 검증', icon: '📊', indexes: [5] }
  ];

  devItems = [
    { nav: '코어 개발', title: '병렬 파일시스템 코어 개발', desc: 'DAOS 스토리지 스택(클라이언트 라이브러리·스토리지 엔진·컨트롤 플레인)을 기반으로 AuroraFS 코어를 구성합니다. AI 워크로드 특성에 맞춘 메타데이터 관리, 네임스페이스, POSIX 호환 계층(dfuse) 확장을 담당합니다.',
      features: [
        'NVMe·Storage Class Memory(SCM) 등 차세대 NVM에 최적화된 분산 비동기 오브젝트 스토어(DAOS) 기반 설계',
        '키-값(key-value) 저장 인터페이스와 트랜잭션 논블로킹 I/O 지원',
        '자체 복구(self-healing) 기반 데이터 보호와 종단 간(end-to-end) 데이터 무결성 보장',
'`dfuse`를 통한 POSIX 호환 파일시스템 계층 및 TensorFlow-IO 등 다양한 애플리케이션 인터페이스 확장'
      ],
      stack: ['C', 'DAOS', 'dfuse', 'NVMe/SCM'],
      links: [{ name: 'DAOS-core', url: 'https://github.com/Adv-FileSystem/DAOS-core' }] },
    { nav: '고속 I/O 스택', title: '유저스페이스 고속 I/O 스택', desc: 'SPDK 기반 커널 우회 I/O 경로를 확보하고 NVMe·NVMe-oF 전송 계층을 튜닝합니다. 폴링 모드 드라이버와 AuroraFS 스토리지 엔진 간 연동 인터페이스를 개발합니다.',
      features: [
        '모든 드라이버를 유저스페이스로 이전해 커널 컨텍스트 스위치·인터럽트 처리 오버헤드 제거',
        '인터럽트 대신 폴링(polled) 모드로 동작하는 NVMe 드라이버 적용',
        'NVMe over Fabrics(NVMe-oF) 타깃으로 스토리지를 패브릭 상에서 블록 디바이스로 노출',
        'vhost·Virtio-SCSI 등 타깃 애플리케이션과 AuroraFS 스토리지 엔진 간 연동 인터페이스 개발'
      ],
      stack: ['C', 'SPDK', 'NVMe-oF', 'DPDK'],
      links: [{ name: 'spdk', url: 'https://github.com/Adv-FileSystem/spdk' }] },
    { nav: '데이터로더 개발', title: 'eBPF 데이터로더 개발', desc: 'AuroraFS에서 사용되는 eBPF 기반 데이터 로더를 개발합니다. 커널 공간에서 데이터 접근 패턴을 관측·제어하여 AI 프레임워크로의 데이터 공급 경로를 최적화합니다.',
      features: [
        'eBPF 프로그램을 커널에 삽입해 파일 읽기·쓰기 등 데이터 접근 이벤트를 실시간 관측',
        '관측된 접근 패턴을 기반으로 프리페치·캐싱 전략을 조정해 AI 학습 파이프라인의 데이터 공급 지연 최소화',
        'AuroraFS 코어 및 dfuse 계층과 연동되는 경량 로더 구조로 설계'
      ],
      stack: ['eBPF', 'C', 'Python'],
      links: [{ name: 'Aurora_Dataloader', url: 'https://github.com/Adv-FileSystem/Aurora_Dataloader' }] },
    { nav: 'ISC 프로토타입', title: 'In-Storage Computing 프로토타입', desc: 'nbdkit Python 플러그인 기반으로 NBD 계층 위의 경량 ISC 읽기/쓰기 프로토타입을 구현합니다. 백엔드 파일에 압축 청크를 저장하고 NBD(Network Block Device)로 외부에 노출하는 구조로, 쓰기 데이터의 zlib 청크 압축, 청크 메타데이터 인덱싱, QEMU·nbd-client 연동 검증을 수행합니다.',
      features: [
        'nbdkit Python 플러그인 형태로 동작, `file=` 파라미터로 지정한 백엔드 파일 위에서 NBD(포트 10809 등)로 블록 디바이스를 노출',
        '`open()` 시 백엔드 파일 유무 확인 후 없으면 1GB 파일 자동 생성, `"r+b"` 모드로 핸들 오픈',
        '`pwrite()`는 원본 데이터를 백엔드 파일에 그대로 기록(seek+write+fsync)한 뒤 `zlib(level=1)`로 압축해 청크로 별도 저장, 기존 겹치는 청크는 `_remove_overlapping_chunks`로 정리',
        '`pread()`는 저장된 압축 청크들을 순회하며 요청 offset·길이와의 겹치는 구간만 압축 해제해 복원하는 방식으로 설계, 현재 코드는 프로토타입 단계',
        '쓰기마다 압축 청크를 `/tmp`에 증거 파일로 남겨 압축 동작을 로그로 확인',
        'QEMU virtio 드라이브 및 `nbd-client` 마운트로 실제 블록 디바이스 동작 검증'
      ],
      stack: ['Python', 'nbdkit', 'NBD', 'zlib'],
      codeLabel: 'nbdkit-isc-rw.py — pwrite()',
      codeDesc: '쓰기 요청이 들어오면 원본 데이터를 백엔드 파일에 그대로 기록(seek+write+fsync)한 뒤, `zlib(level=1)`로 압축해 청크로 별도 보관한다. 기존에 같은 영역을 덮던 청크는 겹치는 부분을 정리(TODO 상태)하고 새 청크로 교체한다.',
      code: `def pwrite(buffer, offset):
    try:
        h.seek(offset)
        h.write(buf)
        h.flush()
        os.fsync(h.fileno())
    except Exception as e:
        print("nbdkit-isc: backing write failed: ", e, file=sys.stderr)
        raise

    # compress buffer (fast, low compression level)
    try:
        comp = zlib.compress(buf, level=1)
    except Exception as e:
        print("nbdkit-isc: compression failed: ", e, file=sys.stderr)
        return

    _remove_overlapping_chunks(offset, len(buf))
    _add_chunk(offset, len(buf), comp)`,
      links: [{ name: 'nbdkit-plugin', url: 'https://github.com/Adv-FileSystem/nbdkit-plugin' }] },
    { nav: '이상탐지 · 데이터 증강', title: 'AI 기반 이상탐지 · 데이터 증강', desc: 'AuroraFS 운영 데이터를 학습하여 시스템 이상 징후를 탐지하는 Anomaly Detection 알고리즘과, 파일시스템 데이터 증강(Data Augmentation) 모델을 개발합니다.',
      features: [
        'Aurora_AD: AuroraFS 운영 로그·메트릭을 기반으로 시스템 이상 탐지 알고리즘 개발',
        'Aurora_DA: 파일시스템 운영 데이터 증강 모델을 통해 학습 데이터 부족 문제 보완',
        '두 모델 모두 AuroraFS 실제 운영 환경에서 수집된 데이터로 검증'
      ],
      stack: ['Python', 'PyTorch'],
      links: [{ name: 'Aurora_AD', url: 'https://github.com/Adv-FileSystem/Aurora_AD' }, { name: 'Aurora_DA', url: 'https://github.com/Adv-FileSystem/Aurora_DA' }] },
    { nav: '벤치마크 및 검증', title: '성능 벤치마크 및 검증 체계', desc: 'PyTorch·TensorFlow 워크로드 하에서 DFUSE와 POSIX 파일시스템의 I/O 성능을 비교하고, perf 콜스택·FlameGraph로 memcpy 및 FUSE 경계 복사 오버헤드를 정량 분석하는 재현 가능한 벤치마크 키트를 구축합니다.',
      features: [
        '`pytorch_bench.py`: `DataLoader` 기반으로 이미지(CIFAR10)·영상(UCF101, OpenCV 디코딩) 배치를 로딩하며 num_workers·pin_memory·batch_size별 samples_per_sec 측정',
        '`tf_bench.py`: `tf.data` 파이프라인(map+batch+prefetch, AUTOTUNE)으로 동일 측정을 수행, TF에 없는 영상 디코딩은 `tf.py_function`으로 OpenCV를 호출해 우회',
        '두 스크립트 모두 워밍업 스텝 분리 후 순수 로딩 시간만 측정해 dfuse(DAOS 마운트)와 POSIX(예: XFS/NVMe) 경로 간 스루풋 비교',
        '캐시를 비운 뒤(drop_caches) 동일 데이터셋을 dfuse·POSIX 경로에 복제해 두고 perf로 콜스택을 수집, memcpy·copy_to_user/from_user 심볼 비중을 비교',
        'FlameGraph 툴셋(stackcollapse-perf.pl, flamegraph.pl)이 있으면 perf 데이터를 SVG로 변환해 FUSE 경계 복사 오버헤드를 시각적으로 비교',
        '결과 해석 기준: dfuse에서 copy_to_user/from_user 비중이 POSIX 대비 늘면 FUSE 경계 복사 오버헤드, memcpy/memmove 비중이 높고 상위 스택이 디코더/변환/배치면 전처리 자체의 복사 비용이 지배적',
        '캐시 상태·워커 수·pinned memory·배치 크기를 바꿔가며 반복 측정하는 민감도 분석 방식(README는 60~120초 단위 반복 권장)'
      ],
      stack: ['Python', 'perf', 'FlameGraph'],
      codeLabel: 'pytorch_bench.py — UCF101.__getitem__()',
      codeDesc: '영상 파일 하나를 OpenCV로 열어 첫 프레임만 읽고, BGR→RGB 변환과 224×224 리사이즈를 거쳐 텐서로 반환한다. TF 경로와 유사하게 이 변환 과정에서 `memcpy`가 발생해 벤치마크가 측정하는 오버헤드의 원인이 된다.',
      code: `def __getitem__(self, idx):
    path = self.files[idx]
    cap = cv2.VideoCapture(path)
    ok, frame = cap.read()
    cap.release()
    if not ok:
        raise RuntimeError(f"Failed to read {path}")
    frame = cv2.cvtColor(frame, cv2.COLOR_BGR2RGB)
    frame = cv2.resize(frame, (224, 224), interpolation=cv2.INTER_AREA)
    # HWC uint8 -> CHW float32 (TF와 유사한 경로로 memcpy 발생)
    x = torch.from_numpy(frame).permute(2,0,1).contiguous()
    return x`,
      links: [{ name: 'io-bench', url: 'https://github.com/Adv-FileSystem/io-bench' }] }
  ];

  selectItem = (i) => this.setState({ selectedIndex: i });
  segmentText = (str) => String(str).split('`').map((text, i) => ({ text, isCode: i % 2 === 1, isCodeFalse: i % 2 === 0 }));
  toggleCat = (c) => this.setState((s) => ({ expandedCats: { ...s.expandedCats, [c]: !s.expandedCats[c] } }));
  idRef = React.createRef();
  pwRef = React.createRef();
  sectionIds = ['devcontent', 'footer'];

  async componentDidMount() {
    const shared = await import('./site-shared.js');
    this.shared = shared;
    this.sb = shared.createClient();
    await shared.loadContent(this.sb, this.sectionIds);
  }

  stopClick = (e) => e.stopPropagation();
  onPwKeyDown = (e) => { if (e.key === 'Enter') this.doLogin(); };
  openLogin = () => this.setState({ showLogin: true, err: '' });
  closeLogin = () => this.setState({ showLogin: false, err: '' });
  logout = () => this.setState({ isAdmin: false });

  saveAll = async () => {
    const { error } = await this.shared.saveSections(this.sb, this.sectionIds);
    if (!error) {
      this.setState({ savedMsg: true });
      clearTimeout(this._savedTimer);
      this._savedTimer = setTimeout(() => this.setState({ savedMsg: false }), 1500);
    } else {
      this.setState({ err: '저장 실패: ' + error.message });
    }
  };

  doLogin = async () => {
    const id = this.idRef.current ? this.idRef.current.value : '';
    const pw = this.pwRef.current ? this.pwRef.current.value : '';
    const ok = await this.shared.checkLogin(this.sb, id, pw);
    if (!ok) { this.setState({ err: '아이디 또는 비밀번호가 올바르지 않습니다.' }); return; }
    this.setState({ isAdmin: true, showLogin: false, err: '' });
  };

  renderVals() {
    const sel = this.state.selectedIndex;
    const items = this.devItems.map((it, i) => ({
      ...it,
      hasCode: !!it.code,
      features: (it.features || []).map(f => ({ raw: f, segs: this.segmentText(f) })),
      codeDescSegs: it.codeDesc ? this.segmentText(it.codeDesc) : null,
      partNum: String(i + 1).padStart(2, '0'),
      nav: it.nav,
      select: () => this.selectItem(i),
      partColor: i === sel ? '#06B6D4' : '#64748B',
      titleColor: i === sel ? '#F1F5F9' : '#94A3B8',
      titleWeight: i === sel ? 600 : 400,
      borderColor: i === sel ? '#06B6D4' : 'transparent',
      bg: i === sel ? 'rgba(6,182,212,0.06)' : 'transparent'
    }));
    const categories = this.categoryDefs.map((c, ci) => ({
      name: c.name,
      icon: c.icon,
      items: c.indexes.map(idx => items[idx]),
      expanded: !!this.state.expandedCats[ci],
      arrowTransform: this.state.expandedCats[ci] ? 'rotate(90deg)' : 'rotate(0deg)',
      toggle: () => this.toggleCat(ci)
    }));
    return {
      items,
      categories,
      selected: items[sel],
      isAdmin: this.state.isAdmin,
      notAdmin: !this.state.isAdmin,
      showLogin: this.state.showLogin,
      err: this.state.err,
      savedMsg: this.state.savedMsg,
      saveAll: this.saveAll,
      idRef: this.idRef,
      pwRef: this.pwRef,
      doLogin: this.doLogin,
      logout: this.logout,
      openLogin: this.openLogin,
      closeLogin: this.closeLogin,
      stopClick: this.stopClick,
      onPwKeyDown: this.onPwKeyDown
    };
  }
}
</script>
</body>
</html>
